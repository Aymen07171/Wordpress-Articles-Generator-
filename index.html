    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var curFetch = typeof origFetch === 'function' ? origFetch.bind(window) : origFetch;
          var desc = {
            configurable: true,
            enumerable: true,
            get: function() {
              return curFetch;
            },
            set: function(val) {
              curFetch = typeof val === 'function' ? val.bind(window) : val;
            }
          };
          try { Object.defineProperty(window, 'fetch', desc); } catch (e) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try { Object.defineProperty(Window.prototype, 'fetch', desc); } catch (e) {}
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try { Object.defineProperty(globalThis, 'fetch', desc); } catch (e) {}
          }
        } catch (e) {}

        function isIgnored(msg, url, stack) {
          var text = String(msg || '') + ' ' + String(url || '') + ' ' + String(stack || '');
          return text.indexOf('chrome-extension://') !== -1 ||
                 text.indexOf('Cannot set property fetch') !== -1 ||
                 text.indexOf('which has only a getter') !== -1;
        }

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          if (isIgnored(msg, url, err && err.stack)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          var file = (event && event.filename) || '';
          var stack = (event && event.error && event.error.stack) || '';
          if (isIgnored(msg, file, stack)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopPropagation) event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && reason.message) || String(reason || '');
          var stack = (reason && reason.stack) || '';
          if (isIgnored(msg, '', stack)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopPropagation) event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
